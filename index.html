<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeeSeva DQMS — Telangana State Digital Queue Management System</title>
    <meta name="description" content="Government of Telangana — Digital Queue & Civic Service Management System across 33 Districts." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231e3a8a' stroke='%23d97706' stroke-width='2'/%3E%3Ctext x='16' y='21' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-size='14' font-weight='bold'%3ETS%3C/text%3E%3C/svg%3E" />
    
    <!-- Hardened Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; img-src 'self' data: https: blob:; connect-src 'self' https: wss: http:; font-src 'self' https://fonts.gstatic.com data:;" />

    <!-- Immediate Theme Initialization (Prevents flash of wrong theme) -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('meeseva-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const initialTheme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', initialTheme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Google Web Fonts (Only active families: Inter & JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
