# MeeSeva DQMS Spring Boot Configuration
server.port=8081

# Oracle Database Connection (Oracle 23ai / 26ai Free)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREE
spring.datasource.username=${ORACLE_DB_USER:system}
spring.datasource.password=${ORACLE_DB_PASSWORD:oracle}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# FreeLLMAPI / AI Service Configuration
freellmapi.base-url=${FREELLMAPI_URL:http://localhost:8000/v1}
freellmapi.api-key=${FREELLMAPI_KEY:}
freellmapi.model=${FREELLMAPI_MODEL:auto:free}
